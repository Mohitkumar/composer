include:
  - ../infra/docker/docker-compose.datastores.yml
  - ../infra/docker/docker-compose.observability.yml

services:
  coordinator:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.coordinator
    container_name: bench-coordinator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - STORE_URL=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - COMPOSER_REDIS_ADDRS=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command:
      - ./coordinator
      - --store.url=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - --redis.addrs=redis:6379
      - --api.http_port=8080
      - --api.grpc_port=50051
      - --outbox.batch_size=100
      - --outbox.concurrency=4
      - --outbox.poll_interval=200ms
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-worker:
        condition: service_started
      js-worker:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - COORDINATOR_ADDR=coordinator:50051
      - STREAM_NAME=workflow.tasks
      - CONSUMER_GROUP=workflow-workers
      - WORKER_ID=worker-{{.Task.Slot}}
      - LANG_WORKER_PYTHON_ADDR=python-worker:50051
      - LANG_WORKER_JS_ADDR=js-worker:50052
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    deploy:
      replicas: 3
    restart: unless-stopped

  python-worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.language-server-py
    container_name: bench-python-worker
    environment:
      - PORT=50051
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import grpc; c=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(c).result(timeout=2)\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  js-worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.language-server-js
    container_name: bench-js-worker
    environment:
      - PORT=50052
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const g=require('@grpc/grpc-js');const c=g.makeClientConstructor({},'',[]);const cl=new c('localhost:50052',g.credentials.createInsecure());cl.waitForReady(Date.now()+2000,e=>process.exit(e?1:0))\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    container_name: bench-web
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - API_INTERNAL_URL=http://coordinator:8080
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped

  mock-server:
    build:
      context: ./mock-server
    container_name: bench-mock-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Run with: docker compose run --rm k6 run /scripts/<test>.js
  k6:
    image: grafana/k6:latest
    profiles: [test]
    volumes:
      - ./k6:/scripts
    networks:
      - default
    environment:
      - BASE_URL=http://coordinator:8080
      - MOCK_SERVER_URL=http://mock-server:8080
      - K6_USERNAME=admin
      - K6_PASSWORD=admin123
    depends_on:
      coordinator:
        condition: service_healthy
      mock-server:
        condition: service_healthy

