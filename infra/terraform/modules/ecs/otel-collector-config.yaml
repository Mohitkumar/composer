# AWS OTEL Collector Configuration for ECS
# This config sends traces to X-Ray and metrics to CloudWatch

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 512
  # Add resource attributes
  resource:
    attributes:
      - key: cloud.provider
        value: aws
        action: upsert
      - key: cloud.platform
        value: aws_ecs
        action: upsert

exporters:
  # Export traces to AWS X-Ray
  awsxray:
    region: ${AWS_REGION}
    # Optional: Add sampling rules
    # sampling_rule:
    #   rule_name: "default"
    #   priority: 10000
    #   fixed_rate: 0.1

  # Export metrics to CloudWatch
  awscloudwatch:
    region: ${AWS_REGION}
    namespace: Composer
    # Optional: Add dimensions
    # dimensions:
    #   - ServiceName
    #   - Environment

  # Debug exporter (logs to stdout)
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [awsxray, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [awscloudwatch, debug]
  extensions: []

