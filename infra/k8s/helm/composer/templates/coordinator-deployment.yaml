{{- if .Values.coordinator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "composer.fullname" . }}-coordinator
  labels:
    {{- include "composer.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  replicas: {{ .Values.coordinator.replicaCount }}
  selector:
    matchLabels:
      {{- include "composer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        {{- include "composer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coordinator
    spec:
      containers:
      - name: coordinator
        image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.coordinator.config.api.httpPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.coordinator.config.api.grpcPort }}
          protocol: TCP
        env:
        - name: STORE_URL
          value: {{ .Values.coordinator.config.store.url | quote }}
        - name: REDIS_ADDRS
          value: {{ join "," .Values.coordinator.config.redis.addrs | quote }}
        - name: API_HTTP_PORT
          value: {{ .Values.coordinator.config.api.httpPort | quote }}
        - name: API_GRPC_PORT
          value: {{ .Values.coordinator.config.api.grpcPort | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.coordinator.env.logLevel | quote }}
        {{- if .Values.coordinator.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.coordinator.otel.endpoint | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: {{ .Values.coordinator.otel.protocol | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.coordinator.otel.serviceName | quote }}
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: {{ .Values.coordinator.otel.resourceAttributes | quote }}
        {{- end }}
        command:
        - ./coordinator
        args:
        - --store.url={{ .Values.coordinator.config.store.url }}
        - --api.http_port={{ .Values.coordinator.config.api.httpPort }}
        - --api.grpc_port={{ .Values.coordinator.config.api.grpcPort }}
        resources:
          {{- toYaml .Values.coordinator.resources | nindent 10 }}
        volumeMounts:
        - name: migrations
          mountPath: /app/migrations
          readOnly: true
      volumes:
      - name: migrations
        configMap:
          name: {{ include "composer.fullname" . }}-migrations
          defaultMode: 0444
      {{- with .Values.coordinator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

