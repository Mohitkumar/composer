{{- $files := .Files }}
{{- if $files.Glob "migrations/*.sql" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "composer.fullname" . }}-migrations
  labels:
    {{- include "composer.labels" . | nindent 4 }}
data:
{{- range $path, $content := $files.Glob "migrations/*.sql" }}
  {{ base $path }}: |
{{ $content | indent 4 }}
{{- end }}
{{- end }}

