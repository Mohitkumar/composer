{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "composer.fullname" . }}-worker
  labels:
    {{- include "composer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "composer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "composer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        env:
        - name: REDIS_ADDR
          value: {{ .Values.worker.env.redisAddr | quote }}
        - name: COORDINATOR_ADDR
          value: {{ .Values.worker.env.coordinatorAddr | quote }}
        {{- with .Values.worker.env.queues }}
        - name: WORKER_QUEUES
          value: {{ . | quote }}
        {{- end }}
        - name: WORKER_CONCURRENCY
          value: {{ .Values.worker.env.concurrency | quote }}
        - name: CONSUMER_GROUP
          value: {{ .Values.worker.env.consumerGroup | quote }}
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        {{- if .Values.worker.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.worker.otel.endpoint | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: {{ .Values.worker.otel.protocol | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.worker.otel.serviceName | quote }}
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: {{ .Values.worker.otel.resourceAttributes | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        {{- with .Values.worker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

