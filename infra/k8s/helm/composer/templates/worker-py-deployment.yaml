{{- if .Values.workerPy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "composer.fullname" . }}-worker-py
  labels:
    {{- include "composer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-py
spec:
  replicas: {{ .Values.workerPy.replicaCount }}
  selector:
    matchLabels:
      {{- include "composer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-py
  template:
    metadata:
      labels:
        {{- include "composer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-py
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker-py
        image: "{{ .Values.workerPy.image.repository }}:{{ .Values.workerPy.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.workerPy.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.workerPy.env.port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.workerPy.env.port | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.workerPy.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "composer.fullname" . }}-worker-py
  labels:
    {{- include "composer.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-py
spec:
  type: {{ .Values.workerPy.service.type }}
  ports:
    - port: {{ .Values.workerPy.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "composer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker-py
{{- end }}

