services:
  postgres:
    image: postgres:16-alpine
    container_name: composer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: composer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: composer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coordinator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.coordinator
    container_name: composer-coordinator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - STORE_URL=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - COMPOSER_REDIS_ADDRS=redis:6379
      - API_HTTP_PORT=8080
      - API_GRPC_PORT=50051
      - LOG_LEVEL=info
      # OpenTelemetry configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=composer-coordinator
      - OTEL_RESOURCE_ATTRIBUTES=service.name=composer-coordinator,service.version=1.0.0
    ports:
      - "8080:8080"  # HTTP API
      - "50051:50051"  # gRPC
    volumes:
      - ../../migrations:/app/migrations:ro
    command: ["./coordinator", "--store.url=postgres://postgres:password@postgres:5432/composer?sslmode=disable", "--redis.addrs=redis:6379", "--api.http_port=8080", "--api.grpc_port=50051"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker-go
    depends_on:
      coordinator:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - COORDINATOR_ADDR=coordinator:50051
      - STREAM_NAME=workflow.tasks
      - CONSUMER_GROUP=workflow-workers
      - WORKER_ID=worker-${HOSTNAME}
      # OpenTelemetry configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=composer-worker
      - OTEL_RESOURCE_ATTRIBUTES=service.name=composer-worker,service.version=1.0.0
    deploy:
      replicas: 2
    restart: unless-stopped

  worker-js:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker-js
    container_name: composer-worker-js
    depends_on:
      - coordinator
    environment:
      - PORT=50052
    ports:
      - "50052:50052"
    restart: unless-stopped

  worker-py:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker-py
    container_name: composer-worker-py
    depends_on:
      - coordinator
    environment:
      - PORT=50051
    ports:
      - "50053:50051"  # Different port to avoid conflict with coordinator gRPC
    restart: unless-stopped

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: composer-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics endpoint
    depends_on:
      - jaeger
    restart: unless-stopped

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: composer-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # Jaeger gRPC
      - "14268:14268"  # Jaeger HTTP
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: composer-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    depends_on:
      - otel-collector
    restart: unless-stopped

  # Grafana for visualization (optional but recommended)
  grafana:
    image: grafana/grafana:latest
    container_name: composer-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"  # Grafana UI
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
