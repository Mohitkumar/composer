include:
  - docker-compose.datastores.yml
  - docker-compose.observability.yml

services:
  coordinator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.coordinator
    container_name: composer-coordinator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - STORE_URL=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - COMPOSER_REDIS_ADDRS=redis:6379
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    command:
      - ./coordinator
      - --store.url=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - --redis.addrs=redis:6379
      - --api.http_port=8080
      - --api.grpc_port=50051
      - --outbox.concurrency=4
    ports:
      - "8080:8080"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      coordinator:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-worker:
        condition: service_started
      js-worker:
        condition: service_started
    environment:
      - REDIS_ADDR=redis:6379
      - COORDINATOR_ADDR=coordinator:50051
      - STREAM_NAME=workflow.tasks
      - CONSUMER_GROUP=workflow-workers
      - LANG_WORKER_PYTHON_ADDR=python-worker:50051
      - LANG_WORKER_JS_ADDR=js-worker:50052
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    deploy:
      replicas: 2
    restart: unless-stopped

  python-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.language-server-py
    container_name: composer-python-worker
    environment:
      - PORT=50051
    restart: unless-stopped

  js-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.language-server-js
    container_name: composer-js-worker
    environment:
      - PORT=50052
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: composer-web
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_USE_PROXY=false
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped

