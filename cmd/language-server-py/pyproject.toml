[project]
name = "composer-worker-py"
version = "1.0.0"
description = "Python language worker for Composer workflow engine"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "main.py",
    "workflow_executor_pb2.py",
    "workflow_executor_pb2_grpc.py",
]

[tool.uv]
dev-dependencies = []

