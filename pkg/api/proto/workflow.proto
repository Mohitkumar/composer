syntax = "proto3";
package workflow;

option go_package = "github.com/mohitkumar/composer/pkg/api/proto/gen/go/workflow";

// WorkflowService defines the gRPC service for worker-coordinator communication
service WorkflowService {
  // ReportTaskResult allows workers to report task execution results
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);

  // AcquireTaskLease lets workers claim a lease on a task before execution
  rpc AcquireTaskLease(AcquireTaskLeaseRequest) returns (AcquireTaskLeaseResponse);

  // PollTaskQueue is a long-polling RPC. The server blocks until a task
  // matching one of the requested task types is available, then returns it.
  // Workers should set a deadline (e.g. 30 s) and re-poll on timeout.
  rpc PollTaskQueue(PollTaskQueueRequest) returns (TaskAssignment);
}

// ReportTaskResultRequest contains task execution results
message ReportTaskResultRequest {
  string task_id = 1;
  string status = 2;  // "completed", "failed"
  bytes output = 3;
  string error = 4;
  map<string, string> metadata = 5;
}

// ReportTaskResultResponse acknowledges result receipt
message ReportTaskResultResponse {
  bool acknowledged = 1;
}

// AcquireTaskLeaseRequest asks coordinator to claim a lease on a task instance
message AcquireTaskLeaseRequest {
  string task_id = 1;
  string owner = 2;
  int64 ttl_seconds = 3;
}

// AcquireTaskLeaseResponse returns whether the lease was acquired
message AcquireTaskLeaseResponse {
  bool acquired = 1;
  string message = 2;
}

// PollTaskQueueRequest registers a worker to receive tasks.
message PollTaskQueueRequest {
  string worker_id = 1;
  repeated string task_types = 2;
}

// TaskAssignment carries all fields a worker needs to execute a task.
message TaskAssignment {
  string task_id = 1;
  string run_id = 2;
  string node_id = 3;
  string node_type = 4;
  string workflow_id = 5;
  int32  workflow_version = 6;
  bytes  input = 7;
}
