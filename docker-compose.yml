version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: composer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: composer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: composer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    container_name: composer-coordinator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - STORE_URL=postgres://postgres:password@postgres:5432/composer?sslmode=disable
      - REDIS_ADDRS=redis:6379
      - API_HTTP_PORT=8080
      - API_GRPC_PORT=50051
      - LOG_LEVEL=info
    ports:
      - "8080:8080"  # HTTP API
      - "50051:50051"  # gRPC
    volumes:
      - ./migrations:/app/migrations
    command: ["./coordinator", "--store.url=postgres://postgres:password@postgres:5432/composer?sslmode=disable", "--api.http_port=8080", "--api.grpc_port=50051"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: composer-worker
    depends_on:
      - coordinator
      - redis
    environment:
      - REDIS_ADDR=redis:6379
      - COORDINATOR_ADDR=coordinator:50051
      - STREAM_NAME=workflow.tasks
      - CONSUMER_GROUP=workflow-workers
      - WORKER_ID=worker-1
    deploy:
      replicas: 2
    restart: unless-stopped

  worker-js:
    build:
      context: .
      dockerfile: Dockerfile.worker-js
    container_name: composer-worker-js
    depends_on:
      - coordinator
    environment:
      - PORT=50052
    ports:
      - "50052:50052"
    restart: unless-stopped

  worker-py:
    build:
      context: .
      dockerfile: Dockerfile.worker-py
    container_name: composer-worker-py
    depends_on:
      - coordinator
    environment:
      - PORT=50051
    ports:
      - "50053:50051"  # Different port to avoid conflict with coordinator gRPC
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
